<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:ital,wght@0,600;0,800;1,700&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Syne:wght@700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- header -->
    <header class="navbar navbar-custom navbar-expand-lg px-4 py-3">
        <div class="container-fluid">
            <a class="navbar-brand text-light fw-bold fs-3" href="#">Beatácora</a>


            <div class="auth-actions d-flex gap-2">
                <!-- Botón que activa el Modal de Login -->
                <button class="btn btn-link text-light text-decoration-none" data-bs-toggle="modal"
                    data-bs-target="#loginModal">
                    Iniciar sesión <i class="fa-regular fa-user ms-1"></i>
                </button>
                <!-- Botón que activa el Modal de Registro -->
                <button class="btn btn-brand btn-sm px-3" data-bs-toggle="modal" data-bs-target="#registerModal">
                    Registrarse
                </button>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <h1 class="text-center fw-bold mb-5">Panel de usuarios</h1>
        <div id="usuarios-container" class="mx-auto favorites-container">

           
        </div>
    </main>

     <!-- Footer -->
    <footer class="footer text-center py-4 border-top border-secondary mt-5 text-secondary">
        <p class="mb-2">Podés encontrarnos también en:</p>
        <div class="social-icons fs-4 mb-3">
            <a href="#" class="text-secondary me-3"><i class="fa-brands fa-facebook"></i></a>
            <a href="#" class="text-secondary me-3"><i class="fa-brands fa-x"></i></a>
            <a href="#" class="text-secondary"><i class="fa-brands fa-instagram"></i></a>
        </div>
        <small>Copyright 2026 Beatácora®. Todos los derechos reservados.</small>
    </footer>

    <script type="module" src="js/panelAdmin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
