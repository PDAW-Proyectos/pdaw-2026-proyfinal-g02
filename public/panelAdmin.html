<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <!-- header -->
    <header class="navbar navbar-custom navbar-expand-lg px-4 py-3">
        <div class="container-fluid">
            <a class="navbar-brand text-light fw-bold fs-3" href="#">Beatácora</a>


            <div class="auth-actions d-flex gap-2">
                <!-- Botón que activa el Modal de Login -->
                <button class="btn btn-link text-light text-decoration-none" data-bs-toggle="modal"
                    data-bs-target="#loginModal">
                    Iniciar sesión <i class="fa-regular fa-user ms-1"></i>
                </button>
                <!-- Botón que activa el Modal de Registro -->
                <button class="btn btn-brand btn-sm px-3" data-bs-toggle="modal" data-bs-target="#registerModal">
                    Registrarse
                </button>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <h1 class="text-center fw-bold mb-5">Panel de usuarios</h1>
        <div id="usuarios-container" class="mx-auto favorites-container">

           
        </div>
    </main>

    <footer class="border-top py-4 text-center mt-auto">

        <p class="small py-2 mb-0">Podes encontrarnos tambien en:</p>
        <div class="container">
            <div class="row">
                <div class="col d-flex justify-content-center align-items-center gap-2 my-2">
                    <a href="#" class="text-light fs-4" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
                    <a href="#" class="text-light fs-4" aria-label="Twitter X"><i class="bi bi-twitter-x"></i></a>
                    <a href="#" class="text-light fs-4" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
                </div>
            </div>
        </div>

        <!-- ================= MODAL DE INICIO DE SESIÓN ================= -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="loginModalLabel">Iniciar Sesión en Beatácora</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label text-secondary small">Correo electrónico</label>
                            <input type="email" class="form-control search-input" id="loginEmail" required
                                placeholder="tu@correo.com">
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label text-secondary small">Contraseña</label>
                            <input type="password" class="form-control search-input" id="loginPassword" required
                                placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-brand w-100 mt-3 py-2">Entrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= MODAL DE REGISTRO ================= -->
    <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="registerModalLabel">Crear una cuenta</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="registerUsername" class="form-label text-secondary small">Nombre de
                                usuario</label>
                            <input type="text" class="form-control search-input" id="registerUsername" required
                                placeholder="tu_usuario" minlength="3" maxlength="20">
                        </div>
                        <div class="mb-3">
                            <label for="registerEmail" class="form-label text-secondary small">Correo
                                electrónico</label>
                            <input type="email" class="form-control search-input" id="registerEmail" required
                                placeholder="tu@correo.com">
                        </div>
                        <div class="mb-3">
                            <label for="registerPassword" class="form-label text-secondary small">Contraseña</label>
                            <input type="password" class="form-control search-input" id="registerPassword" required
                                minlength="6" placeholder="mínimo 6 caracteres">
                        </div>
                        <button type="submit" class="btn btn-brand w-100 mt-3 py-2">Registrarse</button>
                    </form>
                </div>
            </div>
        </div>
    </div>


        <p class="small py-2 mb-0">Copyright 2026 Beatácora©. Todos los derechos reservados</p>
    </footer>
    <script type="module" src="js/panelAdmin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
