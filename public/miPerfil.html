<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:ital,wght@0,600;0,800;1,700&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Syne:wght@700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- header -->
    <header id="main-navbar"></header>

    <main class="container my-5 text-light">
    <h2 class="fw-bold mb-4">Datos de mi Cuenta</h2>
    
    <div class="row">
        <!-- Columna Izquierda: Datos de la Cuenta -->
        <div class="col-md-7">
            <form id="form-perfil" class="bg-dark p-4 rounded-4 border border-secondary shadow-sm">
                
                <!-- Usuario -->
                <div class="mb-3 position-relative">
                    <label for="input-usuario" class="form-label text-secondary small">Nombre de usuario</label>
                    <div class="input-group">
                        <input type="text" id="input-usuario" class="form-control bg-secondary text-light border-0" readonly>
                        <button class="btn btn-outline-light btn-editar" type="button" data-bs-toggle="modal" data-bs-target="#editarCampoModal" data-campo="usuario">
                            <i class="bi bi-pencil"></i>
                        </button>
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3 position-relative">
                    <label for="input-email" class="form-label text-secondary small">Correo electrónico</label>
                    <div class="input-group">
                        <input type="email" id="input-email" class="form-control bg-secondary text-light border-0" readonly>
                        <button class="btn btn-outline-light btn-editar" type="button" data-bs-toggle="modal" data-bs-target="#editarCampoModal" data-campo="email">
                            <i class="bi bi-pencil"></i>
                        </button>
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="mb-3 position-relative">
                    <label for="input-pass" class="form-label text-secondary small">Contraseña</label>
                    <div class="input-group">
                        <input type="password" id="input-pass" class="form-control bg-secondary text-light border-0" value="********" readonly>
                        <button class="btn btn-outline-light btn-editar" type="button" data-bs-toggle="modal" data-bs-target="#editarCampoModal" data-campo="password">
                            <i class="bi bi-pencil"></i>
                        </button>
                    </div>
                </div>

                <!-- Estado de baneo -->
                <div class="mb-3">
                    <label class="form-label text-secondary small">Estado de la cuenta</label>
                    <div id="estado-ban" class="p-2 rounded bg-secondary text-light fw-bold text-center">
                    </div>
                </div>

            </form>
        </div>

        <!-- Columna Derecha: Estadísticas / Listas (Reseñas, Seguidores, etc.) -->
        <div id="columna-actividad" class="col-md-5">
            <div class="bg-dark p-4 rounded-4 border border-secondary shadow-sm">
                <h5 class="text-white mb-3">Actividad</h5>
                <ul class="list-group list-group-flush bg-transparent">
                    <li class="list-group-item bg-transparent text-light d-flex justify-content-between align-items-center">
                        Mis Reseñas <span id="count-mis-resenas" class="badge bg-success rounded-pill">0</span>
                    </li>
                    <li class="list-group-item bg-transparent text-light d-flex justify-content-between align-items-center">
                        Reseñas Favoritas <span id="count-favs" class="badge bg-success rounded-pill">0</span>
                    </li>
                    <li class="list-group-item bg-transparent text-light d-flex justify-content-between align-items-center">
                        Seguidores <span id="count-seguidores" class="badge bg-info rounded-pill">0</span>
                    </li>
                    <li class="list-group-item bg-transparent text-light d-flex justify-content-between align-items-center">
                        Seguidos <span id="count-seguidos" class="badge bg-info rounded-pill">0</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</main>

    <!-- Footer -->
    <footer class="footer text-center py-4 border-top border-secondary mt-5 text-secondary">
        <p class="mb-2">Podés encontrarnos también en:</p>
        <div class="social-icons fs-4 mb-3">
            <a href="#" class="text-secondary me-3"><i class="fa-brands fa-facebook"></i></a>
            <a href="#" class="text-secondary me-3"><i class="fa-brands fa-x"></i></a>
            <a href="#" class="text-secondary"><i class="fa-brands fa-instagram"></i></a>
        </div>
        <small>Copyright 2026 Beatácora®. Todos los derechos reservados.</small>
    </footer>

    <!-- ================= MODAL DE EDICIÓN DE PERFIL ================= -->
    <div class="modal fade" id="editarCampoModal" tabindex="-1" aria-labelledby="editarCampoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="editarCampoModalLabel">Editar información</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <div class="modal-body">
                    <form id="form-editar-campo">
                        <!-- Campo oculto para identificar qué propiedad editamos -->
                        <input type="hidden" id="nombre-campo" name="campo">

                        <div class="mb-3">
                            <label id="label-dinamico" for="valor-input" class="form-label text-secondary small">Nuevo valor</label>
                            <input type="text" class="form-control search-input" id="valor-input" required>
                        </div>

                        <button type="submit" class="btn btn-brand w-100 mt-3 py-2">Guardar cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/miPerfil.js"></script>
</body>

</html>
