<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <!-- header -->
    <header id="main-navbar"></header>

    <main class="container my-5">
        <h1 class="text-center fw-bold mb-4">Explora la música</h1>

        <!-- Barra de búsqueda -->
        <div class="mx-auto favorites-container mb-4">
            <div class="input-group search-bar-container mx-auto">
                <input type="text" id="input-buscar" class="form-control search-input py-2 px-3"
                    placeholder="Buscar canciones" aria-label="Buscar música">
                <span class="input-group-text search-input text-secondary">
                    <i class="bi bi-search"></i>
                </span>
            </div>
        </div>

        <div class="container" id="contenedor-resultados"></div>

        <!-- ================= MODAL DE CREAR RESEÑA ================= -->
        <div class="modal fade" id="resenaModal" tabindex="-1" aria-labelledby="resenaModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content bg-dark text-light border-secondary p-3">
                    <div class="modal-header border-0">
                        <h5 class="modal-title fw-bold" id="resenaModalLabel"><i
                                class="bi bi-star me-2 text-warning"></i>Escribir Reseña</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <!-- Mini reproductor y detalles de la canción dentro del modal -->
                        <div class="row align-items-center mb-4 p-3 bg-black rounded-3 border border-secondary">
                            <div class="col-md-3 text-center mb-3 mb-md-0">
                                <img id="modalCancionImg" src="" alt="Portada" class="img-fluid rounded shadow"
                                    style="width: 100px; height: 100px; object-fit: cover;">
                            </div>
                            <div class="col-md-9">
                                <h5 id="modalCancionTitulo" class="fw-bold mb-1 text-white"></h5>
                                <p id="modalCancionArtista" class="text-secondary small mb-2"></p>
                                <!-- Reproductor con el preview de Deezer -->
                                <audio id="modalAudioPreview" controls class="w-100" style="height: 38px;"></audio>
                            </div>
                        </div>

                        <!-- Formulario de reseña -->
                        <form id="resenaFormModal">
                            <input type="hidden" id="modalCancionId">

                            <div class="mb-3">
                                <label for="modalValoracion" class="form-label text-secondary small">Valoración</label>
                                <select class="form-select search-input" id="modalValoracion" required>
                                    <option value="5">★★★★★ (5 - Obra maestra)</option>
                                    <option value="4">★★★★☆ (4 - Muy buena)</option>
                                    <option value="3">★★★☆☆ (3 - Buena)</option>
                                    <option value="2">★★☆☆☆ (2 - Regular)</option>
                                    <option value="1">★☆☆☆☆ (1 - Mala)</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="modalDescripcion" class="form-label text-secondary small">Tu opinión /
                                    bitácora</label>
                                <textarea class="form-control search-input" id="modalDescripcion" rows="4" required
                                    placeholder="Contá qué te pareció esta canción, qué te transmite..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-brand w-100 py-2 fw-semibold shadow-sm">
                                Publicar Reseña
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-top py-4 text-center mt-auto">

        <p class="small py-2 mb-0">Podes encontrarnos tambien en:</p>
        <div class="container">
            <div class="row">
                <div class="col d-flex justify-content-center align-items-center gap-2 my-2">
                    <a href="#" class="text-light fs-4" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
                    <a href="#" class="text-light fs-4" aria-label="Twitter X"><i class="bi bi-twitter-x"></i></a>
                    <a href="#" class="text-light fs-4" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
                </div>
            </div>
        </div>


        <p class="small py-2 mb-0">Copyright 2026 Beatácora©. Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/explorar.js"></script>
</body>

</html>
