<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <!-- header -->
    <header class="navbar navbar-custom navbar-expand-lg px-4 py-3">
        <div class="container-fluid">
            <a class="navbar-brand text-light fw-bold fs-3" href="#">Beatácora</a>


            <div class="auth-actions d-flex gap-2">
                <!-- Botón que activa el Modal de Login -->
                <button class="btn btn-link text-light text-decoration-none" data-bs-toggle="modal"
                    data-bs-target="#loginModal">
                    Iniciar sesión <i class="fa-regular fa-user ms-1"></i>
                </button>
                <!-- Botón que activa el Modal de Registro -->
                <button class="btn btn-brand btn-sm px-3" data-bs-toggle="modal" data-bs-target="#registerModal">
                    Registrarse
                </button>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <h1 class="text-center fw-bold mb-4">Explora la música</h1>

        <div class="mx-auto favorites-container mb-5">
            <div class="input-group search-bar-container mx-auto">
                <input type="text" class="form-control search-input py-2 px-3"
                    placeholder="Buscar canciones" aria-label="Buscar música">
                <span class="input-group-text search-input text-secondary">
                    <i class="bi bi-search"></i>
                </span>
            </div>
        </div>

        <div class="mx-auto favorites-container mb-4">
            <ul class="nav justify-content-center border-bottom border-secondary pb-2 gap-5">
                <li class="nav-item">
                    <a class="nav-link text-white fw-bold active pb-3 border-bottom border-2 border-white"
                        href="#">Géneros</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-secondary" href="#">Novedades</a>
                </li>
            </ul>
        </div>

        <div class="mx-auto favorites-container">

            <div class="review-card explorar-card mb-4 d-flex align-items-center justify-content-center">
                <div
                    class="img-explorar img-explorar-izq rounded d-flex align-items-center justify-content-center text-secondary">
                    <i class="bi bi-image fs-2"></i>
                </div>
                <div class="text-center">
                    <h5 class="card-title fw-bold mb-1">Titulo de canción</h5>
                    <p class="text-secondary small mb-1">Artista</p>
                    <p class="text-secondary small mb-1">Album</p>
                    <small class="text-secondary">Año de lanzamiento</small>
                </div>
            </div>

            <div class="review-card explorar-card mb-4 d-flex align-items-center justify-content-center">
                <div
                    class="img-explorar img-explorar-izq rounded d-flex align-items-center justify-content-center text-secondary">
                    <i class="bi bi-image fs-2"></i>
                </div>
                <div class="text-center">
                    <h5 class="card-title fw-bold mb-1">Titulo de canción</h5>
                    <p class="text-secondary small mb-1">Artista</p>
                    <p class="text-secondary small mb-1">Album</p>
                    <small class="text-secondary">Año de lanzamiento</small>
                </div>
            </div>

        </div>
    </main>

    <footer class="border-top py-4 text-center mt-auto">

        <p class="small py-2 mb-0">Podes encontrarnos tambien en:</p>
        <div class="container">
            <div class="row">
                <div class="col d-flex justify-content-center align-items-center gap-2 my-2">
                    <a href="#" class="text-light fs-4" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
                    <a href="#" class="text-light fs-4" aria-label="Twitter X"><i class="bi bi-twitter-x"></i></a>
                    <a href="#" class="text-light fs-4" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
                </div>
            </div>
        </div>


        <p class="small py-2 mb-0">Copyright 2026 Beatácora©. Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
