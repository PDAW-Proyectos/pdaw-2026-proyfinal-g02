<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
</head>
<body>
    <h1>inicio</h1>
    <!--AGREGAR ESTO AL HTML -->
    <!-- MODIFICANDOLO COMO SEA NECESARIO -->
        <!-- Mensaje de estado (Cargando / Error) accesible -->
        <div id="status-container" aria-live="polite" class="status-msg"></div>

        <!-- Contenedor donde se insertan las reseñas -->
        <section id="lista-reseñas" class="grilla-reseñas"></section>

        <!-- Plantilla HTML segura para cada reseña -->
        <template id="template-reseña">
        <article class="card-reseña">
            <h3 class="titulo-cancion"></h3>
            <p class="nombre-artista"></p>
            <div class="valoracion-estrellas"></div>
            <p class="texto-reseña"></p>
            <small class="autor-reseña"></small>
        </article>
        </template>
        <form id="review-form" class="review-form">

        <h3>Escribir una reseña</h3>
        
        <div>
            <label for="titulo-cancion">Canción:</label>
            <input type="text" id="titulo-cancion" name="tituloCancion" required />
        </div>

        <div>
            <label for="nombre-artista">Artista:</label>
            <input type="text" id="nombre-artista" name="artista" required />
        </div>

        <div>
            <label for="rating">Puntaje (1 al 5):</label>
            <input type="number" id="rating" name="rating" min="1" max="5" required />
        </div>

        <div>
            <label for="reseña">Tu opinión:</label>
            <textarea id="reseña" name="reseña" required></textarea>
        </div>

        <button type="submit">Publicar Reseña</button>
        </form>
        <!---------------HASTA ACA ! --------------------->
</body>
</html>
